<!doctype html><html><head><meta charset="utf-8"><title>HM57 web test</title>
<script type="importmap">{"imports":{"three":"./lib/three/build/three.module.js","three/addons/":"./lib/three/jsm/"}}</script>
<style>body{margin:0;background:#3a4150}</style></head><body>
<script type="module">
// HM57 browser check: skinned GLB + its own animation clips in three.js (GLTFLoader, AnimationMixer); parts swap
// (body / head / hair module GLBs bound to ONE skeleton by bone name, kit texture swap). Local only.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
const W = 384, H = 512;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H); document.body.appendChild(renderer.domElement); renderer.setClearColor(0x3a4150, 1);
const scene = new THREE.Scene(); scene.add(new THREE.HemisphereLight(0xdde6ff, 0x404040, 1.2));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(0.6, 1.0, 0.9); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.5); fill.position.set(-0.8, 0.3, 0.4); scene.add(fill);
const camera = new THREE.PerspectiveCamera(22, W/H, 0.05, 80); const loader = new GLTFLoader();
let root = null, mixer = null, clips = [], action = null;
function aim(az, el, dist, ty) { const a = az*Math.PI/180, e = el*Math.PI/180, t = new THREE.Vector3(0, ty, 0);
  camera.position.set(t.x + dist*Math.cos(e)*Math.sin(a), t.y + dist*Math.sin(e), t.z + dist*Math.cos(e)*Math.cos(a)); camera.lookAt(t); }
window.T = {
  async load(url) {
    if (root) scene.remove(root);
    const g = await loader.loadAsync(url); root = g.scene; scene.add(root); clips = g.animations; mixer = new THREE.AnimationMixer(root); action = null;
    const prims = []; let skinned = 0, bones = 0;
    root.traverse(o => { if (o.isSkinnedMesh) { skinned++; bones = Math.max(bones, o.skeleton.bones.length); }
      if (o.isMesh) prims.push({ name: o.name, mat: o.material.name, transparent: o.material.transparent, depthWrite: o.material.depthWrite, side: o.material.side, skinned: !!o.isSkinnedMesh, tris: o.geometry.index ? o.geometry.index.count/3 : 0 }); });
    return { prims, skinned, bones, clips: clips.map(c => ({ name: c.name, duration: c.duration, tracks: c.tracks.length })) };
  },
  pose(clipName, t) {
    if (action) { action.stop(); action = null; }
    if (clipName) { const c = clips.find(c => c.name === clipName); action = mixer.clipAction(c); action.play(); mixer.setTime(t); } else { mixer.stopAllAction(); root.traverse(o => { if (o.isSkinnedMesh) o.skeleton.pose(); }); }
    root.updateMatrixWorld(true);
  },
  async assemble(urls) {
    // urls[0] = body module (skeleton + clips); the others (head, hair) are re-bound to the body's bones BY NAME
    if (root) scene.remove(root);
    const gs = await Promise.all(urls.map(u => loader.loadAsync(u))); root = gs[0].scene; clips = gs[0].animations; scene.add(root); mixer = new THREE.AnimationMixer(root); action = null;
    let body = null; root.traverse(o => { if (o.isSkinnedMesh && !body) body = o; });
    const byName = {}; body.skeleton.bones.forEach(b => { byName[b.name] = b; }); let rebound = 0, missing = [];
    for (const g of gs.slice(1)) {
      const ms = []; g.scene.traverse(o => { if (o.isSkinnedMesh) ms.push(o); });
      for (const m of ms) {
        const bones = m.skeleton.bones.map(b => { if (!byName[b.name]) missing.push(b.name); return byName[b.name]; });
        const sk = new THREE.Skeleton(bones, m.skeleton.boneInverses.map(x => x.clone())); const bm = m.bindMatrix.clone();
        body.parent.add(m); m.bind(sk, bm); rebound++;
      }
    }
    root.updateMatrixWorld(true);
    let tris = 0; root.traverse(o => { if (o.isMesh) tris += o.geometry.index ? o.geometry.index.count/3 : 0; });
    return { rebound, missing, tris, clips: clips.map(c => c.name) };
  },
  async swapKit(url) {
    // replace the kit material of the current body with the kit material of another body module (same UV layout)
    const g = await loader.loadAsync(url); let src = null; g.scene.traverse(o => { if (o.isMesh && /Kit/.test(o.material.name)) src = o.material; });
    let n = 0; root.traverse(o => { if (o.isMesh && /Kit/.test(o.material.name)) { o.material = src; n++; } }); return { replaced: n, material: src ? src.name : null };
  },
  hips() { let p = null; root.traverse(o => { if (o.isBone && o.name === 'Hips') { const v = new THREE.Vector3(); o.getWorldPosition(v); p = [v.x, v.y, v.z]; } }); return p; },
  shot(az, el, dist, ty) { aim(az, el, dist, ty); renderer.render(scene, camera); return renderer.domElement.toDataURL('image/png'); },
  setOrder(cardsFirst) { root.traverse(o => { if (o.isMesh && o.material.transparent) { const isCards = /Cards/.test(o.material.name); o.renderOrder = cardsFirst ? (isCards ? -1 : 0) : (isCards ? 1 : 0); } }); },
  setSide(front) { root.traverse(o => { if (o.isMesh && /Skin|Head/.test(o.material.name)) { o.material.side = front ? THREE.FrontSide : THREE.DoubleSide; o.material.needsUpdate = true; } }); },
  async perf(url, n, frames, clipName) {
    if (root) { scene.remove(root); root = null; }
    renderer.setSize(1280, 720); camera.aspect = 1280/720; camera.updateProjectionMatrix();
    const g = await loader.loadAsync(url); const grp = new THREE.Group(); const mixers = [];
    for (let i = 0; i < n; i++) { const h = SkeletonUtils.clone(g.scene); h.position.set((i % 11 - 5)*1.1, 0, Math.floor(i/11)*-2.2); grp.add(h);
      const mx = new THREE.AnimationMixer(h); const c = g.animations.find(c => c.name === clipName); if (c) { mx.clipAction(c).play(); mx.setTime(i*0.05); } mixers.push(mx); }
    scene.add(grp); camera.position.set(0, 4.2, 13.5); camera.lookAt(0, 0.9, -1.1);
    for (let i = 0; i < 20; i++) { mixers.forEach(m => m.update(1/30)); renderer.render(scene, camera); }
    const gl = renderer.getContext(); const t0 = performance.now();
    for (let i = 0; i < frames; i++) { mixers.forEach(m => m.update(1/30)); camera.position.x = Math.sin(i*0.02)*2; camera.lookAt(0, 0.9, -1.1); renderer.render(scene, camera); }
    gl.finish(); const ms = (performance.now() - t0)/frames; const url2 = renderer.domElement.toDataURL('image/png');
    const info = { calls: renderer.info.render.calls, triangles: renderer.info.render.triangles, ms_per_frame: ms, gl_renderer: gl.getParameter(gl.RENDERER), image: url2 };
    scene.remove(grp); renderer.setSize(W, H); camera.aspect = W/H; camera.updateProjectionMatrix(); return info;
  }
};
window.READY = true;
</script></body></html>
